<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Danh thiếp - Công ty TNHH Kỹ Thuật Việt Thắng Lợi</title>
	<link rel="icon" href="img/favicon.ico">
	<meta name="description" content="Danh thiếp nhân viên - Công ty TNHH Kỹ Thuật Việt Thắng Lợi (VTL Tech)">
	<meta property="og:type" content="profile">
	<meta property="og:title" content="Danh thiếp - VTL Tech">
	<meta property="og:image" content="https://tools.vtltech.com.vn/img/VTL_Logo.png">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/responsive.css">
	<link rel="stylesheet" href="css/vtl_tools.css">
</head>
<body>
<div class="body-inner">
	<div id="site-header"></div>

	<div class="page-banner">
		<div class="container">
			<h1 id="page-title">Danh thiếp nhân viên</h1>
			<ol class="breadcrumb">
				<li><a href="index.html">Trang chủ</a></li>
				<li class="active">Danh thiếp</li>
			</ol>
		</div>
	</div>

	<section class="section">
		<div class="container">
			<div class="row">
				<!-- Xem trước danh thiếp -->
				<div class="col-md-6 col-sm-12">
					<h3 class="section-title">Xem trước</h3>

					<div class="card-preview">
						<div class="card-label">Mặt trước</div>
						<div class="namecard namecard-front" id="card-front">
							<div class="nc-qr"><div id="qr-website" title="Mở danh thiếp online"></div></div>
							<div class="nc-person">
								<div id="preview-name"></div>
								<div id="preview-title"></div>
								<div class="nc-line" id="preview-phone"></div>
								<div class="nc-line" id="preview-email"></div>
							</div>
							<div class="nc-logo"><img src="img/VTL_logo.svg" alt="VTL Tech"></div>
							<div class="nc-company">
								<div id="preview-company"></div>
								<div class="nc-line" id="preview-tel"></div>
								<div class="nc-line" id="preview-fax"></div>
								<div class="nc-line" id="preview-website"></div>
								<div class="nc-line" id="preview-address"></div>
							</div>
						</div>
					</div>

					<div class="card-preview">
						<div class="card-label">Mặt sau</div>
						<div class="namecard namecard-back" id="card-back">
							<div class="nc-scan">
								<img src="img/VTL_logo_square.svg" alt="VTL">
								<h4>SCAN ME</h4>
								<small>Lưu vào danh bạ</small>
							</div>
							<div class="qr-box" id="qr-vcard"></div>
						</div>
					</div>
				</div>

				<!-- Form nhập thông tin -->
				<div class="col-md-6 col-sm-12">
					<div class="vtl-box">
						<h3 class="section-title" id="vcard_label">Thông tin cá nhân</h3>
						<form id="form-input" autocomplete="off">
							<div class="row editable">
								<div class="col-sm-6 form-group">
									<label for="name">Họ tên</label>
									<input class="form-control" id="name" type="text">
								</div>
								<div class="col-sm-6 form-group">
									<label for="title">Chức danh</label>
									<input class="form-control" id="title" type="text">
								</div>
								<div class="col-sm-6 form-group">
									<label for="phone">Di động</label>
									<input class="form-control" id="phone" type="tel">
								</div>
								<div class="col-sm-6 form-group">
									<label for="email">Email</label>
									<input class="form-control" id="email" type="email">
								</div>
								<div class="col-sm-6 form-group">
									<label for="company">Tên công ty</label>
									<input class="form-control" id="company" type="text">
								</div>
								<div class="col-sm-6 form-group">
									<label for="website">Website</label>
									<input class="form-control" id="website" type="url">
								</div>
								<div class="col-sm-6 form-group">
									<label for="tel">Tel</label>
									<input class="form-control" id="tel" type="tel">
								</div>
								<div class="col-sm-6 form-group">
									<label for="fax">Fax</label>
									<input class="form-control" id="fax" type="tel">
								</div>
								<div class="col-sm-12 form-group">
									<label for="address">Địa chỉ <small class="text-muted">(mỗi dòng sẽ xuống dòng trên danh thiếp)</small></label>
									<textarea class="form-control" id="address" rows="3"></textarea>
								</div>
							</div>
							<div class="row btn-row">
								<div class="col-sm-4 editable">
									<button type="button" id="updatenamecard-btn" class="btn btn-dark btn-block"><i class="fa fa-refresh"></i> Cập nhật</button>
								</div>
								<div class="col-sm-4">
									<button type="button" id="savenamecard-btn" class="btn btn-primary btn-block"><i class="fa fa-address-book-o"></i> Lưu danh bạ</button>
								</div>
								<div class="col-sm-4">
									<button type="button" id="downloadcard-btn" class="btn btn-dark btn-block"><i class="fa fa-download"></i> Tải ảnh</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div id="site-footer"></div>
</div>

<script src="scripts/jquery.js"></script>
<script src="scripts/bootstrap.min.js"></script>
<script src="scripts/vtl_layout.js"></script>
<script src="scripts/vtl_qr_code_styling.js"></script>
<script src="scripts/vtl_qrcode.min.js"></script>
<script src="scripts/vtl_html2canvas.min.js"></script>
<script src="scripts/vtl_namecards.js"></script>
</body>
</html>
